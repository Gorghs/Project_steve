    <style>
        :root {
            --bg: #f2f9ff;
            --bg-warm: #f7fbff;
            --surface: #ffffff;
            --surface-soft: #eef6ff;
            --line: #e2edf9;
            --line-strong: #cddff3;
            --ink: #101a2c;
            --ink-soft: #4a5b73;
            --ink-faint: #6b7a92;
            --violet: #0284c7;
            --violet-deep: #075985;
            --sky: #38bdf8;
            --mint-deep: #0f766e;
            /* the centred content column.
               It is exactly as wide as the --sk-col column the sticker rails
               are clamped against in assets/stickers.css, so a rail sticker
               can never slide over the headline, the quote or the composer. */
            --colw: 100%;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            min-height: 100vh; /* fallback */
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        .page {
            position: relative;
            isolation: isolate;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* ---------- pastel backdrop ---------- */

        @media (min-width: 1100px) {
            /* the content column shrinks with the viewport so the two sticker
               rails always have a gutter to live in (never over the text) */
            :root { --colw: min(980px, calc(100vw - 360px)); }
        }

        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background:
                radial-gradient(60rem 60rem at 78% 8%, rgba(186, 230, 253, .50), transparent 62%),
                radial-gradient(60rem 60rem at 12% 88%, rgba(165, 214, 245, .45), transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 55%, var(--bg) 100%);
        }

        .backdrop::before {
            content: "";
            position: absolute;
            inset: -18%;
            background:
                radial-gradient(26rem 26rem at 18% 16%, rgba(56, 189, 248, .38), transparent 62%),
                radial-gradient(24rem 24rem at 84% 24%, rgba(14, 165, 233, .32), transparent 62%),
                radial-gradient(22rem 22rem at 72% 78%, rgba(56, 189, 248, .26), transparent 60%),
                radial-gradient(20rem 20rem at 16% 72%, rgba(34, 211, 238, .24), transparent 60%);
            filter: blur(14px);
            animation: drift 34s ease-in-out infinite alternate;
        }

        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(2, 132, 199, .10) 1px, transparent 1px);
            background-size: 26px 26px;
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 32%, #000 12%, transparent 76%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 32%, #000 12%, transparent 76%);
        }

        @keyframes drift {
            from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
            to { transform: translate3d(1.5%, 1.5%, 0) scale(1.04); }
        }

        /* ---------- sticker field container ----------
           Per-sticker position, size and float animation live in the external
           sticker stylesheet - this block only anchors the layer. */

        .sticker-field {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        header {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 12px 20px 4px;
            flex-shrink: 0;
        }

        /* brand logo removed - space freed for decorative background */

        /* ---------- main / hero ---------- */

        main {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 1460px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: visible;
        }

        /* the hero never grows past the sticker column */
        .hero {
            width: 100%;
            max-width: var(--colw);
            margin: 0 auto;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(48px, 6.5vw, 80px);
            line-height: 1.08;
            letter-spacing: -0.035em;
            font-weight: 850;
            color: var(--ink);
            margin-bottom: 14px;
        }

        h1 .accent {
            background: linear-gradient(120deg, #075985 0%, #0284c7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .quote {
            font-size: clamp(22px, 2.8vw, 34px);
            line-height: 1.35;
            color: #45566d;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3em;
            align-items: baseline;
        }

        .quote-static {
            color: var(--ink);
            font-weight: 600;
        }

        .quote-animated {
            position: relative;
            min-width: 0;
            color: var(--violet);
        }

        /* Typography variations for animated text */
        .quote-animated.style-1 { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 500; letter-spacing: 0; }
        .quote-animated.style-2 { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 0; }
        .quote-animated.style-3 { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 500; font-style: italic; letter-spacing: 0; }
        .quote-animated.style-4 { font-family: "SFMono-Regular", "Fira Code", "Fira Mono", Consolas, Menlo, monospace; font-weight: 500; letter-spacing: 0; }
        .quote-animated.style-5 { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 500; letter-spacing: 0.08em; }

        .quote-animated::after {
            content: "";
            display: inline-block;
            width: 2px;
            height: 1.1em;
            margin-left: 3px;
            vertical-align: -0.1em;
            background: var(--violet);
            animation: cursor-blink 1s steps(2) infinite;
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .quote-animated::after {
                animation: none;
                opacity: 0;
            }
        }

        /* ---------- the one wide composer rectangle ---------- */

        .composer {
            display: flex;
            gap: 10px;
            align-items: stretch;
            width: 100%;
            max-width: var(--colw);
            margin: clamp(30px, 4vh, 44px) auto 0;
            background: #fff;
            border: 1px solid #e2edf9;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 24px 60px -30px rgba(2, 132, 199, .28), 0 2px 6px rgba(27, 21, 51, .04);
            text-align: left;
            flex-shrink: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        #requirements {
            flex: 1;
            min-width: 0;
            min-height: 60px;
            max-height: 160px;
            resize: vertical;
            background: transparent;
            border: 0;
            border-radius: 14px;
            padding: 10px 12px;
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
        }

        #requirements::placeholder { color: #5b7a99; }

        #requirements:focus-visible {
            outline: 3px solid #0284c7;
            outline-offset: 2px;
            background: #f7fbff;
        }

        .composer-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0;
        }

        .btn-send {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #075985 0%, #0369a1 100%);
            box-shadow: 0 12px 24px -12px rgba(2, 132, 199, .85);
            transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
            flex-shrink: 0;
        }

        .btn-send:hover { transform: translateY(-1px); box-shadow: 0 16px 28px -14px rgba(2, 132, 199, .95); }
        .btn-send:active { transform: translateY(0) scale(0.98); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-send:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }

        .btn-send svg { width: 20px; height: 20px; stroke: #fff; }

        .status:empty { height: 0; opacity: 0; overflow: hidden; }


        .status {
            color: #45566d;
            font-size: 12px;
            letter-spacing: 0.02em;
            margin-left: 8px;
            white-space: nowrap;
        }

        .status:not(:empty) { margin-top: 0; }

        .status strong { color: #0f766e; }

        /* ---------- example prompt chips ---------- */

        .examples {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            flex-shrink: 0;
        }
        .example-chip[aria-pressed="true"],
        .example-chip.is-active {
            background: #0369a1;
            border-color: #0369a1;
            color: #fff;
        }

        .example-chip[aria-pressed="true"]:hover,
        .example-chip.is-active:hover {
            background: #075985;
            border-color: #075985;
            color: #fff;
        }


        .example-chip {
            background: #eef6ff;
            border: 1px solid #a9d8f7;
            color: #075985;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            line-height: 1.2;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
        }

        .example-chip:hover { background: #d5ecfd; border-color: #a9d8f7; }
        .example-chip:active { transform: translateY(1px); }

        /* ---------- result panel ---------- */

        .result-panel {
            margin-top: 24px;
            margin-bottom: 30px;
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 18px;
            padding: 16px;
            text-align: left;
            width: 100%;
            box-shadow: 0 24px 60px -25px rgba(2, 132, 199, 0.22), 0 4px 16px rgba(15, 23, 42, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: panelFadeIn 0.35s ease-out;
        }

        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #4a5b73;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #edf4fc;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .result-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-tabs {
            display: inline-flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }

        .view-tab {
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            font-family: inherit;
        }

        .view-tab.is-active {
            background: #ffffff;
            color: #0284c7;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        }

        .result-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .copy-btn, .download-btn {
            background: #eef6ff;
            border: 1px solid #cfe8fb;
            color: #075985;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.01em;
            font-family: inherit;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .download-btn {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }

        .copy-btn:hover { background: #d5ecfd; border-color: #a9d8f7; }
        .download-btn:hover { background: #0369a1; border-color: #0369a1; }

        .result-view-panel {
            width: 100%;
        }

        .workflow-canvas-container {
            width: 100%;
            height: 480px;
            min-height: 420px;
            border-radius: 12px;
            border: 1px solid #e2edf9;
            position: relative;
            overflow: hidden;
            background: #f8fafc;
        }

        .json-output {
            width: 100%;
            height: 480px;
            min-height: 420px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
            font-size: 12.5px;
            line-height: 1.6;
            resize: none;
            overflow: auto;
        }

        .hidden { display: none; }

        /* ---------- footer ---------- */

        footer {
            position: relative;
            z-index: 3;
            max-width: 1240px;
            margin: 0 auto;
            padding: 6px 20px 16px;
            color: #4a5b73;
            text-align: center;
            font-size: 11.5px;
            letter-spacing: 0.08em;
            flex-shrink: 0;
        }

        footer > div { display: inline-block; }

        .social-list {
            list-style: none;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 12px 0 8px;
            padding: 0;
        }

        .social-list a {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #e2edf9;
            box-shadow: 0 10px 20px -16px rgba(2, 132, 199, .6);
            transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .social-list a:hover {
            transform: translateY(-2px);
            border-color: #cfe8fb;
            box-shadow: 0 14px 24px -16px rgba(2, 132, 199, .75);
        }

        .social-list img {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* Footer credit removed - Icons8 attribution removed per requirement */

        /* ---------- focus + motion ---------- */

        :focus-visible {
            outline: 3px solid #0284c7;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }

            .backdrop::before { animation: none !important; }

            .btn-send:hover,
            .social-list a:hover { transform: none; }
        }

        /* ---------- responsive ---------- */

        @media (max-width: 860px) {
            .composer {
                flex-direction: column;
                gap: 10px;
                border-radius: 22px;
            }

            .composer-actions { align-items: stretch; justify-content: center; }
            .btn-send { width: 100%; }
            #requirements { min-height: 80px; }
        }

        @media (max-width: 719px) {
            header { padding: 10px 16px 4px; }
            main { padding: 0 16px; }
            h1 { font-size: clamp(38px, 9vw, 54px); margin-bottom: 10px; }
            .quote { font-size: clamp(19px, 5.2vw, 26px); }
            .composer { margin-top: 24px; padding: 10px; }
            .examples { gap: 6px; }
            .example-chip { padding: 6px 12px; font-size: 11.5px; }
            footer { padding: 4px 16px 12px; font-size: 11px; }
            .social-list { gap: 8px; margin: 8px 0 6px; }
            .social-list a { width: 36px; height: 36px; }
            .social-list img { width: 16px; height: 16px; }
        }

        @media (max-width: 640px) {
            .result-panel {
                padding: 12px;
                border-radius: 14px;
                margin-top: 18px;
            }
            .result-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .result-header-left {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .view-tabs {
                width: 100%;
                display: flex;
            }
            .view-tab {
                flex: 1;
                justify-content: center;
                text-align: center;
                padding: 8px 10px;
                font-size: 11.5px;
            }
            .result-actions {
                width: 100%;
                display: flex;
                gap: 8px;
            }
            .copy-btn, .download-btn {
                flex: 1;
                justify-content: center;
                padding: 8px 10px;
                font-size: 11.5px;
            }
            .workflow-canvas-container,
            .json-output {
                height: 380px;
                min-height: 320px;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .result-panel {
                padding: 14px;
            }
            .workflow-canvas-container,
            .json-output {
                height: 440px;
                min-height: 380px;
            }
        }
    </style>

<body>
    <div class="page">
        <div class="backdrop" aria-hidden="true"></div>

        <div class="sticker-field" aria-hidden="true">
            <span class="sticker s01">
                <img class="sticker-img" src="/assets/stickers/cursor.webp" alt="" width="48" height="48" loading="lazy" decoding="async" draggable="false" fetchpriority="low">
            </span>
            <span class="sticker s02">
                <img class="sticker-img" src="/assets/stickers/api.webp" alt="" width="46" height="46" loading="lazy" decoding="async" draggable="false" fetchpriority="low">
            </span>

        <main>
            <div class="hero">
                <h1>Project <span class="accent">Steve</span></h1>
                <p class="quote">
                    <span class="quote-static">Turn your ideas into</span>
                    <span class="quote-animated" aria-live="polite" aria-atomic="true"></span>
                </p>

                <div class="composer">
                    <label class="sr-only" for="requirements">Prompt / Requirement</label>
                    <textarea id="requirements" placeholder="Describe the workflow you want to automate, e.g., Sync Stripe payments to Postgres..."></textarea>
                    <div class="composer-actions">
                        <button class="btn-send" id="generate-btn" aria-label="Send prompt" title="Send prompt">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                        <span class="status" id="status-text" role="status" aria-live="polite"></span>
                    </div>
                </div>

                <div class="examples" role="group" aria-label="Example prompts">
                    <button type="button" class="example-chip" data-prompt="Sync Stripe payments to Postgres">Sync Stripe payments to Postgres</button>
                    <button type="button" class="example-chip" data-prompt="Email me a daily sales digest">Email me a daily sales digest</button>
                    <button type="button" class="example-chip" data-prompt="Log API errors to Slack">Log API errors to Slack</button>
                </div>

                <div class="result-panel hidden" id="result-panel">
                    <div class="result-header">
                        <div class="result-header-left">
                            <span class="result-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16" style="vertical-align:-2px; color:#0284c7;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4M6.5 10v4M17.5 10v4M10 17.5h4"/></svg>
                                Workflow Architecture
                            </span>
                            <div class="view-tabs" role="tablist" aria-label="Workflow view switcher">
                                <button type="button" class="view-tab is-active" id="tab-canvas-btn" role="tab" aria-selected="true" aria-controls="canvas-view">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" style="vertical-align:-2px; margin-right:5px;"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/></svg>
                                    Interactive Canvas
                                </button>
                                <button type="button" class="view-tab" id="tab-json-btn" role="tab" aria-selected="false" aria-controls="json-view">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" style="vertical-align:-2px; margin-right:5px;"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                    Raw JSON
                                </button>
                            </div>
                        </div>
                        <div class="result-actions">
                            <button type="button" class="copy-btn" id="copy-json-btn" title="Copy workflow JSON to clipboard">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                Copy JSON
                            </button>
                            <button type="button" class="download-btn" id="download-json-btn" title="Download n8n workflow file">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Download .json
                            </button>
                        </div>
                    </div>

                    <div id="canvas-view" class="result-view-panel">
                        <div id="workflow-canvas-container" class="workflow-canvas-container"></div>
                    </div>

                    <div id="json-view" class="result-view-panel hidden">
